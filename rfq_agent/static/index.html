<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>报价台 · RFQ Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M9 21V11h3.4l3.6 5 3.6-5H23v10h-2.8v-5.6L16.7 19h-1.4l-3.5-3.6V21z' fill='white'/%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8;
    --line:#e2e8f0; --line2:#f1f5f9; --bg:#f6f8fb; --card:#fff;
    --accent:#1d4ed8; --accent-soft:#eef4ff;
    --ok:#067647; --ok-soft:#ecfdf3; --ok-line:#abefc6;
    --warn:#b54708; --warn-soft:#fffaeb; --warn-line:#fedf89;
    --bad:#b42318; --bad-soft:#fef3f2;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}

  .top{display:flex;align-items:center;gap:18px;height:50px;padding:0 18px;background:var(--card);
       border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:650;letter-spacing:-.2px}
  .brand small{font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.4px}
  .spacer{flex:1}
  .topmeta{display:flex;align-items:center;gap:16px;font-size:11.5px;color:var(--muted)}
  .topmeta b{font-weight:600;color:var(--ink2)}

  .shell{display:grid;grid-template-columns:272px minmax(0,1fr);height:calc(100% - 50px)}

  /* left */
  .side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-head{display:flex;justify-content:space-between;align-items:center;padding:13px 13px 7px;
             font-size:11.5px;font-weight:650;color:var(--ink2)}
  .side-head span{color:var(--faint);font-weight:500}
  ul.list{list-style:none;margin:0;padding:0 7px;overflow:auto}
  ul.list.pool{max-height:190px;padding-bottom:8px}
  li.item{border-radius:8px;padding:8px 9px;cursor:pointer;border:1px solid transparent}
  li.item:hover{background:var(--line2)}
  li.item.on{background:var(--accent-soft);border-color:#c7d7fe}
  li.item.off{opacity:.55;cursor:default}
  li.item .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  li.item .who{font-weight:640;font-size:12.5px}
  li.item .cnt{font-size:10.5px;color:var(--faint)}
  li.item .sub{font-size:10.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li.item .meta{font-size:10.5px;color:var(--faint);margin-top:3px;display:flex;gap:5px;align-items:center}
  .tag{padding:0 5px;border-radius:4px;background:var(--line2);color:var(--ink2);font-size:10px;line-height:15px;white-space:nowrap}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tag.new{background:var(--accent-soft);color:var(--accent)}
  li.pool-item{display:flex;align-items:center;gap:8px;padding:7px 9px}
  li.pool-item .who{flex:1;min-width:0}
  .divider{border-top:1px solid var(--line2);margin:8px 0 2px}
  .drop{margin:8px 10px 12px;padding:11px 10px;border:1px dashed #cbd5e1;border-radius:8px;text-align:center;
        color:var(--muted);font-size:11.5px;background:#fcfdff}
  .drop:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .drop b{display:block;font-size:12px;font-weight:600;margin-bottom:1px}
  .side-foot{margin:auto 10px 10px;padding-top:6px;border-top:1px solid var(--line2)}
  .side-foot button{width:100%;background:none;border:0;color:var(--faint);font-size:10.5px;
                    padding:5px;cursor:pointer;font-family:inherit}
  .side-foot button:hover{color:var(--ink2);text-decoration:underline}

  /* work */
  .work{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
  #docwrap:not([hidden]){display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  .empty{margin:auto;max-width:380px;text-align:center;color:var(--muted)}
  .empty h2{font-size:15px;font-weight:650;color:var(--ink);margin:0 0 6px}
  .dochead{flex-shrink:0;padding:15px 22px 0;background:var(--card);border-bottom:1px solid var(--line)}
  .doc-head{display:flex;align-items:flex-start;gap:14px}
  .doc-head h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.2px}
  .doc-head .sub{margin-top:2px;font-size:11.5px;color:var(--muted)}
  .doc-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:650;background:var(--line2);color:var(--ink2)}
  .pill.awaiting_review{background:var(--warn-soft);color:var(--warn)}
  .pill.draft_ready,.pill.exported{background:var(--ok-soft);color:var(--ok)}
  .doc-actions{display:flex;gap:8px;padding:12px 0 14px;align-items:center}
  .doc-actions .note{font-size:11px;color:var(--faint);margin-left:4px}

  .btn{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:6px 12px;font-size:12px;color:var(--ink2)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#1a44bd;color:#fff}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--faint);font-weight:500}
  .btn.quiet:hover{border-color:transparent;background:transparent;color:var(--ink2);text-decoration:underline}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.lg{padding:8px 16px;font-size:12.5px}

  .stages{flex:1;min-height:0;overflow:auto;padding:16px 22px 80px;scroll-padding-bottom:80px}
  .stage{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;margin-bottom:12px}
  .stage .no{width:26px;height:26px;border-radius:50%;background:var(--line2);color:var(--faint);
             display:grid;place-items:center;font-size:11.5px;font-weight:650;border:1px solid var(--line);margin-top:11px}
  .stage.ok .no{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .stage.warn .no{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .stage.wait .no{background:#fff;color:var(--faint);border-style:dashed}
  .stage.wait .card{background:#fcfdff;border-style:dashed}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card>header{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line2)}
  .card>header h2{margin:0;font-size:12.5px;font-weight:650}
  .card>header .spacer{flex:1}
  .card>.body{padding:11px 13px}
  .card>.foot{padding:8px 13px;border-top:1px solid var(--line2);background:#fcfdff;font-size:10.5px;
              color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .card>.foot code{font-family:var(--mono);color:var(--ink2)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px 18px}
  .kv .k{font-size:10.5px;color:var(--faint);margin-bottom:1px}
  .kv .v{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kv .v.mono{font-family:var(--mono);font-size:11.5px}
  .kv .v.big{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
  .bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 20px}
  .bar .h{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .bar .t{height:4px;background:var(--line2);border-radius:2px;overflow:hidden}
  .bar .f{height:100%;background:var(--ok);border-radius:2px}
  .bar .f.warn{background:var(--warn)}
  .findings{display:flex;flex-direction:column;gap:5px;margin-top:11px;padding-top:10px;
            border-top:1px dashed var(--line)}
  .finding{display:flex;gap:8px;align-items:baseline;font-size:11.5px}
  .finding .dot2{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none;margin-top:5px}
  .finding.warn .dot2{background:var(--warn)}
  .finding .t{color:var(--ink2);font-weight:600;white-space:nowrap}
  .finding .d{color:var(--muted);min-width:0}
  .finding .ex{color:var(--faint);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
  .reqs{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .reqs .h{font-size:10.5px;color:var(--faint);margin-bottom:4px}
  .reqs ol{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
  .reqs li{font-size:11.5px;color:var(--ink2)}
  .reqs li em{font-style:normal;color:var(--faint);font-size:10px;font-family:var(--mono);margin-left:5px}
  .terms{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;
         flex-direction:column;gap:4px}
  .terms .h{font-size:10.5px;color:var(--faint);margin-bottom:2px}
  .terms .h span{color:var(--muted)}
  .term{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:baseline;font-size:11.5px}
  .term .ic{font-family:var(--mono);font-size:11px;text-align:center;color:var(--faint)}
  .term.met .ic{color:var(--ok)}
  .term.todo .ic{color:var(--warn)}
  .term.manual .ic{color:var(--accent)}
  .term .tx{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .term .tx em{font-style:normal;color:var(--faint);font-size:10px;font-family:var(--mono);margin-left:5px}
  .term .lb{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .term .dt{grid-column:2/-1;color:var(--faint);font-size:10.5px;margin-top:-2px}

  .asks{display:flex;flex-direction:column;gap:9px}
  .ask{border:1px solid var(--warn-line);background:#fffdf7;border-radius:8px;padding:9px 11px}
  .ask .h{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--warn);margin-bottom:3px}
  .ask .q{font-size:12.5px;font-weight:600}
  .ask .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .ask .opts button{border:1px solid #d6d3d1;background:#fff;border-radius:6px;padding:4px 9px;font-size:11.5px}
  .ask .opts button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .ask details{margin-top:6px;font-size:11px;color:var(--muted)}
  .ask summary{cursor:pointer;color:var(--accent)}
  .ask code{font-family:var(--mono)}
  .art{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11.5px}
  .art a{color:var(--accent);text-decoration:none}
  .art a:hover{text-decoration:underline}
  .muted{color:var(--faint);font-size:11.5px}

  .gate{padding:26px 24px;text-align:center}
  .gate h2{margin:0 0 6px;font-size:15px}
  .gate p{margin:0 auto 14px;max-width:460px;color:var(--muted);font-size:12.5px}
  .pipeline{display:flex;justify-content:center;gap:6px;margin:0 0 16px;flex-wrap:wrap}
  .pipeline span{font-size:11px;color:var(--muted);background:var(--line2);border-radius:999px;padding:3px 9px}
  .pipeline span.stop{background:var(--warn-soft);color:var(--warn)}
  .runlog{display:flex;flex-direction:column;gap:7px}
  .reading{border:1px solid #ddd6fe;background:#f5f3ff;border-radius:8px;padding:9px 11px;
           margin-top:9px;font-size:12px;color:var(--ink2)}
  .reading .h{font-size:10.5px;color:var(--accent);font-weight:650;margin-bottom:3px}
  .reading ul{margin:5px 0 0;padding-left:16px;color:var(--faint);font-size:11px;line-height:1.55}
  .runstep{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:start;
           font-size:11.5px;color:var(--ink2)}
  .runstep .mark{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-top:5px}
  .runstep .at{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .resultbox{margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .resultbox>summary{cursor:pointer;padding:10px 13px;font-size:12px;font-weight:650;color:var(--ink2)}
  .resultbox>.inside{padding:0 12px 2px;border-top:1px solid var(--line2)}
  .resultbox .stage{margin-top:12px}

  /* upload preview modal + full-page drop veil */
  .veil{position:fixed;inset:0;background:#0f172a66;z-index:20;display:grid;place-items:center;padding:20px}
  .veil[hidden]{display:none}
  .modal{background:var(--card);border-radius:12px;box-shadow:0 24px 80px #0f172a40;
         width:min(580px,100%);max-height:calc(100vh - 60px);display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:baseline;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:13.5px;font-weight:650;flex:1;min-width:0;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-body{padding:13px 16px;overflow:auto}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;
              padding:11px 16px;border-top:1px solid var(--line);background:#fcfdff}
  .modal-foot .l{margin-right:auto}
  .dragveil{position:fixed;inset:0;z-index:30;background:#1d4ed812;display:grid;place-items:center}
  .dragveil[hidden]{display:none}
  .dragveil>div{border:2px dashed var(--accent);border-radius:14px;padding:26px 42px;
                background:#fff;color:var(--accent);font-size:15px;font-weight:650;pointer-events:none}
  table.sample{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}
  table.sample th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
  table.sample td{padding:4px 6px;border-bottom:1px solid var(--line2)}
  .pverr{border:1px solid var(--warn-line);background:var(--bad-soft);color:var(--bad);
         border-radius:8px;padding:10px 12px;font-size:12px}

  /* Optional question entry, outside the workbench layout. */
  .ask-launch{position:fixed;right:18px;bottom:16px;z-index:10;display:flex;align-items:center;gap:8px;
              padding:9px 14px;border:1px solid #c7d7fe;border-radius:999px;background:var(--card);
              box-shadow:0 8px 30px #0f172a1c;color:var(--accent);font-weight:650}
  .ask-launch:hover{background:var(--accent-soft)}
  .ask-launch[aria-expanded="true"]{display:none}
  .ask-panel{position:fixed;right:16px;bottom:16px;z-index:11;width:min(360px,calc(100vw - 32px));
             height:min(440px,calc(100vh - 88px));background:var(--card);border:1px solid var(--line);
             border-radius:12px;box-shadow:0 18px 60px #0f172a30;display:flex;flex-direction:column;overflow:hidden}
  .ask-panel[hidden]{display:none}
  .ask-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
            color:var(--ink2);font-size:12px;font-weight:650}
  .ask-head .model{margin-left:auto;font-weight:500;color:var(--faint);font-size:10.5px;
                   overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:135px}
  .ask-close{border:0;background:transparent;color:var(--muted);font-size:19px;line-height:1;
             padding:2px 5px;border-radius:5px}
  .ask-close:hover{background:var(--line2);color:var(--ink)}
  .thread{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg .who{font-size:10px;color:var(--faint);margin-bottom:3px}
  .msg .txt{background:#fbfcfe;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
            white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5}
  .msg.me .txt{background:var(--accent);border-color:var(--accent);color:#fff}
  .msg.me .who{text-align:right}
  .msg.tool .txt{background:#fff;border-style:dashed;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
  .msg.sys .txt{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  .composer{border-top:1px solid var(--line2);padding:9px 11px;display:flex;gap:6px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;font:inherit;font-size:12px;padding:7px 9px;border:1px solid #cbd5e1;
                     border-radius:7px;min-height:34px;max-height:96px;background:#fcfdff;color:var(--ink)}
  .composer textarea:focus{outline:none;border-color:var(--accent);background:#fff}
  .composer textarea:disabled{background:var(--line2);color:var(--faint)}
  .notice{position:fixed;right:18px;bottom:67px;z-index:12;max-width:min(380px,calc(100vw - 36px));
          padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
          box-shadow:0 8px 24px #0f172a1c;color:var(--ink2);font-size:12px}
  .notice.error{border-color:var(--warn-line);color:var(--bad)}
  .notice[hidden]{display:none}
  @media(max-width:760px){.shell{grid-template-columns:190px minmax(0,1fr)}
    .topmeta{gap:8px}.dochead{padding:12px 14px 0}.stages{padding:12px 14px 80px}}
  @media(max-width:520px){.shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .side{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
    .side .divider,.side .pool,.side .side-foot,.side .current-head{display:none}
    .side .list{display:flex;overflow-x:auto;gap:4px}.side .item{min-width:150px}
    .side .drop{margin:5px 10px 7px;padding:5px}
    .topmeta #dataline{display:none}}

  .drawer{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
  .drawer[hidden]{display:none}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:11px 22px;background:var(--card);
               border-bottom:1px solid var(--line)}
  .drawer-head h2{margin:0;font-size:13px;font-weight:650}
  .tablewrap{flex:1;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  thead th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--muted);
           padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  tbody tr:hover{background:#fbfcfe}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  .pn{font-family:var(--mono);font-size:11px}
  .why{color:var(--warn)}
  .src{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .prov{font-size:10px;color:var(--faint);white-space:nowrap}
  .spin{display:inline-block;width:9px;height:9px;border:2px solid var(--line);border-top-color:var(--accent);
        border-radius:50%;animation:sp .7s linear infinite;vertical-align:0}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* inquiry analysis report */
  .ana{display:flex;flex-direction:column;gap:9px}
  .ana table{width:100%;border-collapse:collapse;font-size:11.5px}
  .ana th,.ana td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  .ana th{font-size:10.5px;color:var(--faint);font-weight:600}
  .ana .st{white-space:nowrap;font-weight:600}
  .ana .st.pending,.ana .st.inquiry{color:var(--warn)}
  .ana .st.priced{color:var(--ok)}
  .ana .loc{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .ana .why{color:var(--muted)}
  .ana .stamp{font-size:11px;color:var(--accent);font-weight:600}

  .stepper{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px}
  .stepper button.step{flex:1 0 0;min-width:76px;border:1px solid var(--line);background:#fff;
                       border-radius:8px;padding:6px 4px 7px;color:var(--ink2);line-height:1.25}
  .stepper button.step .ix{display:block;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
  .stepper button.step .nm{display:block;font-size:13px;font-weight:650;white-space:nowrap}
  .stepper button.step:hover{border-color:var(--accent)}
  .stepper button.step.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stepper button.step.on .ix{color:#dbe6ff}
  .stepper button.step.done{background:var(--ok-soft);border-color:var(--ok-line)}
  .stepper button.step.attn{box-shadow:inset 0 0 0 1px var(--warn-line)}
  .hscroll{overflow:auto;margin-top:8px;max-height:calc(100vh - 300px)}
  table.grid{width:max-content;min-width:max(100%,1200px);border-collapse:collapse;font-size:11.5px}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;white-space:nowrap}
  table.grid th{font-size:10.5px;color:var(--faint);font-weight:600;position:sticky;top:0;background:#fff;z-index:1}
  table.grid td.wrap{white-space:normal;min-width:220px;max-width:360px}
  .out{font-weight:650}
  .out.grounded{color:var(--ok)}
  .out.pending{color:var(--warn)}
  .out.blocked{color:var(--bad);font-weight:600}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pager{display:flex;gap:8px;align-items:center;margin-top:8px}
  .callout{border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--ink2);
           border-radius:8px;padding:12px 14px}
  .callout strong{color:var(--warn)}
  .panel-note{margin:0 0 10px;color:var(--muted);font-size:12px}
  .intake-identity{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px}
  .intake-identity strong{font-size:20px;color:var(--ink)}
  .intake-identity code{font-size:13px;color:var(--ink2)}
  .source-files{margin:14px 0;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fafcff}
  .source-files .h{font-weight:650;font-size:12px;margin-bottom:6px}
  .source-files a{display:inline-block;margin:3px 12px 3px 0;font-size:12px}
  table.grid.extraction-grid{table-layout:fixed;width:100%;min-width:1800px}
  table.grid.extraction-grid td{white-space:normal;overflow-wrap:anywhere;min-width:0;max-width:none}
  .extract-issue{color:var(--ink2);font-weight:600}
  .extract-issue .warn{display:block;padding:7px 9px;border:1px solid #f0d18c;border-radius:6px;background:#fff1c9;color:#8b4b00}
  .extract-issue .warn+ .warn{margin-top:5px}
  .extract-issue .info{color:var(--muted)}
  .extract-issue small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
  .extract-flag{background:#fff8e8}
  .raw-values{color:var(--ink2);columns:2;column-gap:16px;line-height:1.4}
  .raw-values>div{break-inside:avoid}
  .raw-values>div+div,.source-location>div+div{margin-top:2px}
  .source-location{line-height:1.4}
</style>
</head>
<body>
<header class="top">
  <div class="brand">报价台 <small>RFQ DESK</small></div>
  <div class="spacer"></div>
  <div class="topmeta">
    <span id="dataline">数据 —</span>
    <span id="policyline">策略 —</span>
  </div>
</header>

<main class="shell">
  <aside class="side">
    <div class="side-head">收件箱 <span id="count"></span></div>
    <ul class="list" id="tasks"></ul>
    <div class="divider"></div>
    <div class="side-head current-head">演示素材 <span id="poolcount"></span></div>
    <ul class="list pool" id="list"></ul>
    <div class="drop" id="drop"><b>导入询价邮件</b>拖入 .eml 或点击选择，可多选</div>
    <input type="file" id="file" accept=".eml" multiple hidden />
    <div class="side-foot"><button id="reset" title="只清空浏览器当前查看，不删除后端任务记录">清空当前查看</button></div>
  </aside>

  <section class="work">
    <div class="empty" id="empty">
      <h2>从收件箱选一个任务，或从演示素材开始</h2>
      <div>点「演示素材」会先确认：打开已有任务，或作为新任务运行。<br />
        收件箱里是已经处理过的任务，随时点回现场。</div>
    </div>

    <div id="docwrap" hidden>
      <div class="dochead">
        <div class="doc-head">
          <div>
            <h1 id="cust">—</h1>
            <div class="sub" id="subline">—</div>
          </div>
          <div class="right"><span class="pill" id="status">—</span></div>
        </div>
        <nav class="stepper" id="stepper" aria-label="报价步骤"></nav>
        <div class="doc-actions">
          <button class="btn primary" id="primary" type="button">运行新任务</button>
          <button class="btn quiet" id="rerun" type="button" hidden>再次运行</button>
          <span class="note" id="stepnote"></span>
        </div>
      </div>
      <div class="stages" id="stages"></div>
    </div>
  </section>

  <div class="veil" id="veil" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="导入预览">
      <div class="modal-head"><h2 id="pvtitle">导入预览</h2><span class="muted" id="pvqueue"></span></div>
      <div class="modal-body" id="pvbody"></div>
      <div class="modal-foot" id="pvfoot"></div>
    </div>
  </div>
  <div class="dragveil" id="dragveil" hidden><div>松开以导入询价邮件（.eml，可多个）</div></div>
  <div class="veil" id="choose" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="演示素材">
      <div class="modal-head"><h2 id="chooseTitle">演示素材</h2></div>
      <div class="modal-body" id="chooseBody"></div>
      <div class="modal-foot" id="chooseFoot"></div>
    </div>
  </div>

  <button class="ask-launch" id="askOpen" type="button" aria-controls="askPanel"
          aria-expanded="false">提问 / 调用助手</button>
  <section class="ask-panel" id="askPanel" aria-label="提问助手" hidden>
    <div class="ask-head">提问助手 <span class="model" id="modelname"></span>
      <button class="ask-close" id="askClose" type="button" aria-label="收起提问助手">×</button></div>
    <div class="thread" id="thread">
      <div class="msg"><div class="who">提示</div><div class="txt">可询问当前任务的报价依据或待确认项。</div></div>
    </div>
    <div class="composer">
      <textarea id="chat" rows="1" placeholder="例如：这单为什么停住了？"></textarea>
      <button class="btn primary" id="send">发送</button>
    </div>
  </section>
  <div class="notice" id="notice" role="status" hidden></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v) => (v === null || v === undefined || v === "")
  ? "—" : Number(v).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const CONTAINER = { "body-html": "正文表格", "body-text": "正文表格", "attachment-xlsx": "Excel 附件",
                    "attachment-pdf": "PDF 附件" };
const RULE_LABEL = { pn_match: "件号匹配", certificate: "证书/适航", uom: "计量单位", condition: "件状", quote_due: "报价截止" };
const SOURCE = { internal: "内部库存", supplier: "供应商报价", manual: "转人工" };
const STAGE = { received: "待处理", parsed: "已解析", priced: "待确认", draft: "已出草案" };

let TASKS = [], CASES = [], CASEKEY = null, S = null, SID = null, DATA = null, BUSY = false;
let STEP = 1, EXTRACT_OFFSET = 0, LINE_OFFSET = 0, REPORT_OFFSET = 0, REVIEW_TAB = "open", PANEL_TOKEN = 0;
let noticeTimer = null;
const PAGE = 40;
const STEPS = ["输入采集", "结构提取", "询价分析", "人工预审", "分析报告", "报价草案"];

function notify(message, error = false) {
  const notice = $("notice");
  notice.textContent = message;
  notice.className = "notice" + (error ? " error" : "");
  notice.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice.hidden = true; }, 5000);
}

function setAskOpen(open) {
  $("askPanel").hidden = !open;
  $("askOpen").setAttribute("aria-expanded", String(open));
  if (open) $("chat").focus();
  else $("askOpen").focus();
}

function resetQuestionContext() {
  SID = null;
  $("thread").innerHTML = `<div class="msg"><div class="who">提示</div>
    <div class="txt">可询问当前任务的报价依据或待确认项。</div></div>`;
}

function setUrl(taskId) {
  const url = taskId ? `?task=${encodeURIComponent(taskId)}` : location.pathname;
  history.replaceState(null, "", url);
}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  };
  const res = await fetch(path, opt);
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text || `HTTP ${res.status}` }; }
  if (!res.ok) {
    const error = new Error(data.error || `HTTP ${res.status}`);
    error.data = data;
    throw error;
  }
  return data;
}

function existingTaskId(meta) {
  const inbox = TASKS.find((t) => t.key === meta.key && t.task_id);
  return (inbox && inbox.task_id) || meta.task_id || "";
}

/* ---------- lists: inbox (real tasks) + demo fixtures ---------- */
async function refresh() {
  const [tasks, fixtures] = await Promise.all([api("/api/cases"), api("/api/fixtures")]);
  TASKS = tasks;
  CASES = fixtures;
  $("count").textContent = tasks.length;
  $("poolcount").textContent = fixtures.length;

  $("tasks").innerHTML = tasks.length ? tasks.map((t) => {
    const cls = t.stage === "draft" ? "ok" : t.stage === "priced" ? "warn" : "new";
    return `<li class="item${S && t.task_id === S.task_id ? " on" : ""}${t.task_id ? "" : " off"}"
      data-task="${esc(t.task_id || "")}" data-key="${esc(t.key || "")}">
      <div class="r1"><span class="who">${esc(t.customer || t.key)}</span><span class="cnt">${t.lines} 行</span></div>
      <div class="sub">${esc(t.subject || t.file)}</div>
      <div class="meta"><span class="tag">${esc(CONTAINER[t.container] || t.container)}</span>
        <span class="tag ${cls}">${esc(STAGE[t.stage] || t.stage)}</span></div>
    </li>`;
  }).join("") : `<li class="pool-item"><div class="who muted">收件箱为空：运行下方素材，或导入询价邮件</div></li>`;
  $("tasks").querySelectorAll("li.item[data-task]").forEach((li) => {
    if (li.dataset.task) li.onclick = () => openTask(li.dataset.task, li.dataset.key);
  });

  $("list").innerHTML = CASES.map((c) => {
    const hasTask = !!existingTaskId(c);
    return `<li class="item${c.key === CASEKEY ? " on" : ""}" data-key="${esc(c.key)}">
      <div class="r1"><span class="who">用例 ${esc(c.key)} · ${esc(c.customer)}</span><span class="cnt">${c.lines} 行</span></div>
      <div class="sub">${esc(c.subject || c.file)}</div>
      <div class="meta"><span class="tag">${esc(CONTAINER[c.container] || c.container)}</span>
        <span class="tag ${hasTask ? "ok" : ""}">${hasTask ? "有已有任务" : "尚未运行"}</span></div>
    </li>`;
  }).join("");
  $("list").querySelectorAll("li.item").forEach((li) => { li.onclick = () => askMaterial(li.dataset.key); });
}

function closeChoose() { $("choose").hidden = true; }

function askMaterial(key) {
  if (!$("veil").hidden) return;
  const meta = CASES.find((c) => c.key === key);
  if (!meta) return;
  const existing = existingTaskId(meta);
  $("chooseTitle").textContent = `演示素材 · 用例 ${meta.key}`;
  $("chooseBody").innerHTML = existing
    ? `<p>这封素材已经有任务。请先选择：<b>打开已有任务</b>会回到上次的现场；<b>作为新任务运行</b>会新建一条并进入收件箱，不覆盖旧任务。</p>`
    : `<p>这封素材还没有任务。<b>作为新任务运行</b>会解析、定价，并停在需要人工决定的地方。不会读取其他案例以前的结果。</p>`;
  const openBtn = existing
    ? `<button class="btn" id="chooseOpen" type="button">打开已有任务</button>` : "";
  $("chooseFoot").innerHTML = `<button class="btn l" id="chooseCancel" type="button">取消</button>
    ${openBtn}<button class="btn primary" id="chooseRun" type="button">作为新任务运行</button>`;
  $("choose").hidden = false;
  $("chooseCancel").onclick = closeChoose;
  if (existing) $("chooseOpen").onclick = () => { closeChoose(); openTask(existing, key); };
  $("chooseRun").onclick = () => { closeChoose(); CASEKEY = key; start(); };
}

/* ---------- open a task that already exists (inbox / deep link) ---------- */
async function openTask(taskId, caseKey) {
  let state;
  try { state = await api(`/api/task?id=${encodeURIComponent(taskId)}`); }
  catch (e) { notify(`任务加载失败：${e.message}`, true); return; }
  S = state;
  CASEKEY = caseKey || null;
  EXTRACT_OFFSET = 0; LINE_OFFSET = 0; REPORT_OFFSET = 0; REVIEW_TAB = "open";
  STEP = 2;
  resetQuestionContext();
  setUrl(S.task_id);
  $("empty").hidden = true; $("docwrap").hidden = false;
  render();
  refresh();
}

async function resetDemo() {
  CASEKEY = null; S = null; SID = null; STEP = 1;
  EXTRACT_OFFSET = 0; LINE_OFFSET = 0; REPORT_OFFSET = 0; REVIEW_TAB = "open";
  resetQuestionContext();
  setUrl(null);
  await refresh();
  $("docwrap").hidden = true; $("empty").hidden = false;
  $("cust").textContent = ""; $("subline").textContent = ""; $("status").textContent = "";
  notify("当前查看已清空；任务记录仍保存在收件箱。");
}

async function start() {
  if (BUSY) return;
  if (!CASEKEY) { notify("请先选择一个演示素材，或导入询价邮件。", true); return; }
  BUSY = true;
  resetQuestionContext();
  EXTRACT_OFFSET = 0; LINE_OFFSET = 0; REPORT_OFFSET = 0; REVIEW_TAB = "open";
  $("empty").hidden = true; $("docwrap").hidden = false;
  const meta = CASES.find((c) => c.key === CASEKEY);
  if (!S) {
    $("cust").textContent = meta ? meta.customer : CASEKEY;
    $("subline").textContent = meta ? [CONTAINER[meta.container] || meta.container, `${meta.lines} 行`].join(" · ") : "";
    $("status").className = "pill"; $("status").textContent = "处理中";
  }
  STEP = 1;
  paintChrome();
  $("primary").disabled = true;
  $("rerun").disabled = true;
  $("stages").innerHTML = `<div class="muted" style="padding:8px 2px"><span class="spin"></span>
    解析邮件 · 提取行项目 · 查参考表…（停在需要你决定的地方）</div>`;
  try {
    S = await api("/api/run", { case: CASEKEY, autonomy: "interactive" });
    STEP = 2;
    setUrl(S.task_id);
    notify(`新任务已执行并进入收件箱；${S.open_reviews} 项待预审。`);
  } catch (e) {
    notify(e.message, true);
    if (!S) {
      $("stages").innerHTML = `<div class="muted" style="color:var(--bad)">${esc(e.message)}</div>`;
      BUSY = false;
      paintChrome();
      refresh();
      return;
    }
  } finally {
    BUSY = false;
  }
  render();
  refresh();
}

function go(step) { STEP = step; render(); }

function rememberCase() {
  if (S && !CASEKEY) {
    const hit = TASKS.find((t) => t.task_id === S.task_id) || CASES.find((c) => c.task_id === S.task_id);
    if (hit) CASEKEY = hit.key;
  }
}

function showPrimary(label, action) {
  const btn = $("primary");
  btn.hidden = false;
  btn.disabled = BUSY;
  btn.className = "btn primary";
  btn.textContent = label;
  btn.onclick = action;
}

function paintChrome() {
  rememberCase();
  const rerun = $("rerun");
  rerun.hidden = !(CASEKEY && S);
  rerun.disabled = BUSY;
  rerun.className = "btn quiet";
  rerun.textContent = "再次运行";
  rerun.title = "创建新任务，不覆盖当前任务";
  rerun.onclick = start;

  const buttons = STEPS.map((name, index) => {
    const n = index + 1;
    const on = n === STEP;
    let done = false;
    if (S) {
      if (n <= 3 || n === 5) done = true;
      if (n === 4 && !S.open_reviews) done = true;
      if (n === 6 && (S.artifacts || []).some((file) => file.startsWith("quote"))) done = true;
    }
    const attn = !!(S && S.open_reviews && n === 6 && !on);
    const cls = `step${on ? " on" : ""}${done && !on ? " done" : ""}${attn ? " attn" : ""}`;
    return `<button type="button" class="${cls}" data-step="${n}" aria-current="${on ? "step" : "false"}">
      <span class="ix">${n}</span><span class="nm">${name}</span></button>`;
  }).join("");
  $("stepper").innerHTML = buttons;
  $("stepper").querySelectorAll("button[data-step]").forEach((b) => {
    b.onclick = () => go(Number(b.dataset.step));
  });

  if (!S) {
    showPrimary("运行新任务", start);
    $("stepnote").textContent = CASEKEY ? "确认后才会创建新任务" : "";
    $("status").className = "pill";
    if (!$("status").textContent || $("status").textContent === "—") $("status").textContent = "待处理";
    return;
  }
  const open = S.open_reviews || 0;
  const quotable = !!S.quote_allowed;
  const canApprove = quotable && S.approval_enabled && S.status !== "active";
  const hasQuote = (S.artifacts || []).some((file) => file.startsWith("quote"));
  $("cust").textContent = S.customer || "—";
  $("subline").textContent = [S.rfq_number, CONTAINER[S.container] || S.container,
    `${(S.summary && S.summary.lines) || 0} 行`, S.evaluation_date ? `评估日 ${S.evaluation_date}` : "",
    (S.source_files || []).join("、")].filter(Boolean).join(" · ");
  $("status").className = "pill " + (S.status || "");
  $("status").textContent = S.status === "awaiting_review" ? `待确认 ${open}`
    : S.status === "exported" ? "已导出" : S.status === "draft_ready" ? "草案就绪"
    : S.status === "active" ? "已批准" : (S.status || "—");
  $("policyline").textContent = `策略 ${S.policy_version || "—"}`;
  if (DATA && DATA.snapshot_id) {
    $("dataline").innerHTML = `数据 <b>${esc(DATA.snapshot_id)}</b> · ${(DATA.price_rows || 0) + (DATA.cost_rows || 0)} 行`;
  }

  if (STEP === 1) {
    $("primary").hidden = true;
    $("stepnote").textContent = CASEKEY ? "需要重跑时用「再次运行」，会新建任务" : "输入已采集";
  } else if (STEP === 2) {
    showPrimary("查看询价分析", () => go(3));
    $("stepnote").textContent = "结构已提取，价格决定不在这一步";
  } else if (STEP === 3) {
    showPrimary(open ? "进入人工预审" : "查看分析报告", () => go(open ? 4 : 5));
    $("stepnote").textContent = "只读定位，不在这一步做决定";
  } else if (STEP === 4) {
    if (open) {
      $("primary").hidden = true;
      $("stepnote").textContent = `停在 ${open} 项需要你决定的地方`;
    } else {
      showPrimary("查看分析报告", () => go(5));
      $("stepnote").textContent = "待预审项已清空";
    }
  } else if (STEP === 5) {
    const again = (S.artifacts || []).some((file) => file.startsWith("analysis"));
    showPrimary(again ? "重新导出分析报告" : "导出分析报告", doExport);
    $("stepnote").textContent = "成功或失败都会生成询价分析报告";
  } else if (open) {
    showPrimary("去完成人工预审", () => go(4));
    $("stepnote").textContent = "报价草案可查看；生成前要先完成人工预审";
  } else if (canApprove && hasQuote) {
    showPrimary(S.approval_mode === "demo" ? "演示批准并写入历史" : "批准并写入历史", doApprove);
    $("stepnote").textContent = "批准后才写入历史报价表";
  } else if (quotable) {
    showPrimary(hasQuote ? "重新生成报价草案" : "生成报价草案", doExport);
    $("stepnote").textContent = hasQuote ? "文件已生成，可在本页下载" : "可以生成报价草案";
  } else {
    showPrimary("查看分析报告", () => go(5));
    $("stepnote").textContent = "当前处置不生成报价单";
  }
}

function render() {
  paintChrome();
  const token = ++PANEL_TOKEN;
  paintPanel(token);
}

function fileLinks(files) {
  if (!files.length) return `<div class="muted">导出后，下载链接会出现在这里。</div>`;
  return `<div class="art">${files.map((name) =>
    `<a href="/api/download?id=${encodeURIComponent(S.task_id)}&file=${encodeURIComponent(name)}" target="_blank">${esc(name)}</a>`
  ).join("")}</div>`;
}

function analysisFiles() {
  return (S.artifacts || []).filter((name) => name.startsWith("analysis") || name.startsWith("draft-"));
}

function draftFiles() {
  return (S.artifacts || []).filter((name) => /^(analysis|draft|quote-draft|quote)-/.test(name));
}

function paintPanel(token) {
  if (!S) {
    $("stages").innerHTML = `<div class="gate">
      <h2>演示素材尚未运行</h2>
      <p>点上方「运行新任务」会创建全新的 task，自动执行到人工预审后停止。
         若这封素材已有任务，请从左侧重新点开，并选择「打开已有任务」。</p>
      <div class="pipeline"><span>输入采集</span><span>结构提取</span><span>询价分析</span>
        <span class="stop">人工预审</span><span>分析报告</span><span>报价草案</span></div>
    </div>`;
    return;
  }
  if (STEP === 1) paintIntake();
  else if (STEP === 2) paintStructure(token);
  else if (STEP === 3) paintInquiry(token);
  else if (STEP === 4) paintReviews(token);
  else if (STEP === 5) paintReport(token);
  else paintDraft();
}

/* ---------- what the agent understood about the input ---------- */
function readingBlock() {
  const ex = (S && S.extraction) || {};
  if (!ex.mode) return "";
  const mode = ex.mode === "audit" ? "代码解析 + 模型审查" : "模型抽取（逐字段校验）";
  const issues = (ex.issues || []).filter((i) => i.kind !== "reconciled").slice(0, 5);
  const stats = [];
  if (ex.mode === "audit" && ex.lines_deterministic) stats.push(`${ex.lines_deterministic} 行由解析器读出`);
  if (ex.mode === "extract" && ex.lines_model) stats.push(`${ex.lines_model} 行由模型抽出并回指原文`);
  if (ex.requirements_added) stats.push(`新增 ${ex.requirements_added} 条客户要求`);
  if ((ex.refused || []).length) stats.push(`拒收 ${ex.refused.length} 行（未通过校验）`);
  return `<div class="reading"><div class="h">输入理解 · ${esc(mode)}</div>
    <div>${esc(ex.judgement || ex.reason || "")}</div>
    ${stats.length ? `<div class="muted" style="margin-top:3px">${esc(stats.join(" · "))}</div>` : ""}
    ${issues.length ? `<ul>${issues.map((i) => `<li>${esc(i.detail)}</li>`).join("")}</ul>` : ""}
  </div>`;
}

async function paintStructure(token) {
  const m = S.summary || { lines: 0 };
  const f = S.fields || {};
  const qs = S.quality_summary || { warn: 0, info: 0 };
  const pct = (n) => m.lines ? Math.round(n / m.lines * 100) : 0;
  const bar = (label, n) => `<div class="bar"><div class="h"><span>${label}</span>
      <span class="num">${n}/${m.lines}</span></div>
      <div class="t"><div class="f ${n < m.lines ? "warn" : ""}" style="width:${pct(n)}%"></div></div></div>`;
  $("stages").innerHTML = `<p class="panel-note">${qs.warn ? `${qs.warn} 类待核对事项` : `${m.lines} 行已结构化`}。逐行核对询价号、提取值、原始值和评审标记；未声明字段不自动补默认值。</p>
    <div class="bars">${bar("料号", f.part_number || 0)}${bar("数量", f.quantity || 0)}${bar("单位", f.unit || 0)}${bar("件状要求", f.condition || 0)}</div>
    <p class="muted">${f.with_evidence || 0}/${m.lines} 行可回溯到原始单元格${qs.info ? ` · ${qs.info} 条载体说明` : ""}</p>
    <div id="extractBody"><span class="spin"></span> 正在载入提取结果…</div>`;
  let page;
  try { page = await api(`/api/extraction?id=${encodeURIComponent(S.task_id)}&offset=${EXTRACT_OFFSET}&limit=${PAGE}`); }
  catch (e) {
    if (token === PANEL_TOKEN) $("extractBody").innerHTML = `<div class="muted" style="color:var(--bad)">${esc(e.message)}</div>`;
    return;
  }
  if (token !== PANEL_TOKEN) return;
  const rows = page.lines || [];
  const issueCell = (items) => items.length ? items.map((issue) => `<div class="${issue.severity === "warn" ? "warn" : "info"}">${esc(issue.title)}<small>${esc(issue.detail)}</small></div>`).join("") : "—";
  const body = rows.map((r) => {
    const raw = Object.entries(r.raw || {}).filter(([, value]) => value !== "").map(([key, value]) => `<div>${esc(key)}: ${esc(value)}</div>`).join("");
    const location = [r.citation.email, r.citation.attachment, r.citation.sheet,
      r.citation.row != null ? `第 ${r.citation.row} 行` : ""].filter(Boolean).map((part) => `<div>${esc(part)}</div>`).join("");
    return `<tr class="${r.issues.some((issue) => issue.severity === "warn") ? "extract-flag" : ""}">
      <td class="r num">${esc(r.line_number ?? "—")}</td><td>${esc(r.inquiry_no || "—")}</td><td><span class="pn">${esc(r.part_number)}</span></td>
      <td class="wrap">${esc(r.description || "—")}</td><td class="r num">${esc(r.quantity)} ${esc(r.unit)}</td>
      <td>${esc((r.condition || []).join(" / ") || "未声明")}</td><td>${esc(r.priority || "未声明")}</td>
      <td>${esc(r.due_at || "—")}</td><td class="extract-issue">${issueCell(r.issues)}</td>
      <td class="raw-values">${raw || "原值未保存"}</td><td class="source-location">${location || "—"}</td></tr>`;
  }).join("");
  const unlocated = (page.unlocated_issues || []).map((issue) => `<tr class="${issue.severity === "warn" ? "extract-flag" : ""}"><td>—</td><td colspan="7">单据级 / 未定位到行</td>
    <td class="extract-issue">${issueCell([issue])}</td><td colspan="2">—</td></tr>`).join("");
  const from = page.total ? page.offset + 1 : 0;
  const to = page.offset + rows.length;
  $("extractBody").innerHTML = `<div class="hscroll" tabindex="0" role="region" aria-label="结构提取明细，可横向及纵向滚动"><table class="grid extraction-grid">
    <colgroup><col style="width:44px"><col style="width:104px"><col style="width:110px"><col style="width:220px">
      <col style="width:90px"><col style="width:66px"><col style="width:76px"><col style="width:166px">
      <col style="width:280px"><col style="width:360px"><col style="width:284px"></colgroup><thead><tr>
    <th class="r">#</th><th>询价单号</th><th>料号</th><th>描述</th><th class="r">数量 / 单位</th><th>件状</th>
    <th>优先级</th><th>报价截止</th><th>评审标记</th><th>原始值</th><th>原件位置</th>
    </tr></thead><tbody>${body || `<tr><td colspan="11">没有提取行</td></tr>`}${unlocated}</tbody></table></div>
    <div class="pager"><button class="btn" id="extractPrev" type="button">上一页</button>
      <span class="muted">${from}–${to} / ${page.total}</span>
      <button class="btn" id="extractNext" type="button">下一页</button></div>`;
  $("extractPrev").disabled = page.offset <= 0;
  $("extractNext").disabled = page.offset + rows.length >= page.total;
  $("extractPrev").onclick = () => { EXTRACT_OFFSET = Math.max(0, page.offset - PAGE); render(); };

async function paintReviews(token) {
  const openN = S.open_reviews || 0;
  const passedN = S.answered_reviews || 0;
  $("stages").innerHTML = `<div class="tabs" id="revtabs">
      <button type="button" data-tab="open" class="${REVIEW_TAB === "open" ? "on" : ""}">待预审 ${openN}</button>
      <button type="button" data-tab="passed" class="${REVIEW_TAB === "passed" ? "on" : ""}">已通过 ${passedN}</button>
    </div>
    <p class="panel-note">${REVIEW_TAB === "open"
      ? "待预审项全部列在这里。已通过的决定在旁边，不挤在决定区里。"
      : "这些项已经有决定，只供回看。"}</p>
    <div id="revbody"><span class="spin"></span> 正在载入…</div>`;
  $("revtabs").querySelectorAll("button").forEach((b) => {
    b.onclick = () => { REVIEW_TAB = b.dataset.tab; render(); };
  });
  const host = document.createElement("div");
  host.className = "asks";
  const passed = REVIEW_TAB === "passed";
  let offset = 0;
  let total = 0;
  let shown = 0;
  $("revbody").textContent = "";
  $("revbody").appendChild(host);
  host.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-item]");
    if (button) resolve(button.dataset.item, button.dataset.opt);
  });
  try {
    for (;;) {
      const page = await api(`/api/reviews?id=${encodeURIComponent(S.task_id)}&bucket=${passed ? "passed" : "open"}&offset=${offset}&limit=80`);
      if (token !== PANEL_TOKEN || (REVIEW_TAB === "passed") !== passed) return;
      total = page.total;
      const items = page.items || [];
      if (!items.length) break;
      host.insertAdjacentHTML("beforeend", items.map((item) => reviewCard(item, passed)).join(""));
      shown += items.length;
      offset += items.length;
      if (shown >= total) break;
    }
  } catch (e) {
    if (token === PANEL_TOKEN) host.innerHTML = `<div class="muted" style="color:var(--bad)">${esc(e.message)}</div>`;
    return;
  }
  if (token !== PANEL_TOKEN) return;
  if (!total) {
    host.innerHTML = `<div class="muted">${passed ? "还没有已通过的决定。" : "没有待预审项。"}</div>`;
  } else {
    const note = document.createElement("div");
    note.className = "muted";
    note.textContent = `已显示全部 ${total} 项`;
    host.appendChild(note);
  }
}

      ? "可报价的修订在这里生成草案。分析报告的下载也放在本页。"
      : "当前商业处置不会生成报价单。分析报告仍可在第 5 步导出，下载也列在下面。"}</p>`}
    <div class="k" style="font-size:10.5px;color:var(--faint);margin-bottom:4px">下载</div>
    ${fileLinks(draftFiles())}
    ${termBlock}
    ${regen ? `<div style="margin-top:8px">${regen}</div>` : ""}
    ${approved ? `<div class="ana"><div class="stamp">${esc(S.approval.label)}：${esc(S.approval.approved_by)} · ${esc(S.approval.approved_at)} · ${esc(S.approval.quote_id || "")}（已写入历史报价表）</div></div>` : ""}
    <p class="muted" style="margin-top:8px">产物是待复核草案：未计税费运费，不预留库存。</p>`;
  const regenBtn = $("regen");
  if (regenBtn) regenBtn.onclick = doExport;
}

async function resolve(itemId, optionId) {
  const rev = S.revision;
  try {
    S = await api("/api/resolve", { task_id: S.task_id, revision: rev, item_id: itemId, option_id: optionId });
    render();
    refresh();
    notify(`已记录决定；任务继续执行至 revision ${S.revision}。`);
  } catch (e) { notify(e.message, true); }
}

async function doApprove() {
  const who = (window.prompt("批准人姓名（将写入历史报价表与报价文件）") || "").trim();
  if (!who) return;
  try {
    S = await api("/api/activate", { task_id: S.task_id, revision: S.revision, approved_by: who });
    render();
    refresh();
    notify("已批准：历史报价已写入，正式文件可在当前任务下载。");
  } catch (e) { notify(e.message, true); }
}

async function doExport() {
  if (BUSY || !S) return;
  BUSY = true;
  $("primary").disabled = true;
  try {
    const response = await api("/api/export", { task_id: S.task_id, revision: S.revision });
    S = response;
    notify("文件已生成（询价分析报告必出；可报价时另附报价草案），下载在分析报告和报价草案里。");
  } catch (e) { notify(e.message, true); }
  finally {
    BUSY = false;
    render();
    refresh();
  }
}

/* ---------- chat ---------- */
function chatSay(kind, who, text) {
  const div = document.createElement("div");
  div.className = "msg " + (kind === "me" ? "me" : kind === "tool" ? "tool" : kind === "sys" ? "sys" : "");
  div.innerHTML = `<div class="who">${esc(who)}</div><div class="txt">${esc(text)}</div>`;
  $("thread").appendChild(div);
  $("thread").scrollTop = $("thread").scrollHeight;
  return div;
}

async function send() {
  const box = $("chat"), text = box.value.trim();
  if (!text || $("send").disabled) return;
  box.value = ""; chatSay("me", "我", text);
  $("send").disabled = true;
  const pending = chatSay("tool", "调用中", "…");
  try {
    const r = await api("/api/chat", { session_id: SID, message: text, task_id: S ? S.task_id : null });
    SID = r.session_id || SID;
    pending.remove();
    showChatTrace(r.trace);
    if (r.error) chatSay("sys", "错误", r.error);
    if (r.reply) chatSay("agent", "助手", r.reply);
    if (r.state) {
      const first = !S;
      S = r.state;
      if (first) STEP = 2;
      render();
      refresh();
    }
  } catch (e) {
    pending.remove();
    SID = e.data?.session_id || SID;
    showChatTrace(e.data?.trace);
    chatSay("sys", "错误", e.message);
  }
  finally { $("send").disabled = false; box.focus(); }
}

function showChatTrace(trace) {
  if (!trace?.length) return;
  const labels = {get_task_overview: "任务概况", get_task: "任务概况", list_task_issues: "问题列表",
    get_review_item: "复核详情", explain_line: "行项目依据", get_lines: "行项目", get_history: "执行历史"};
  chatSay("tool", "查询记录", trace.map((t) => `${labels[t.tool] || t.tool}${t.cached ? "（复用）" : ""}${t.ok ? "" : "（失败）"}`).join(" → "));
}

/* ---------- upload: preview → confirm → inbox ---------- */
let QUEUE = [], QINDEX = 0, CONFIRMED = 0, LAST_TASK = null, PV_BUSY = false;

function openVeil(bodyHtml, footHtml, title, queueText) {
  if (title !== undefined) $("pvtitle").textContent = title;
  $("pvqueue").textContent = queueText || "";
  $("pvbody").innerHTML = bodyHtml;
  $("pvfoot").innerHTML = footHtml;
  $("veil").hidden = false;
}
function closeVeil() { $("veil").hidden = true; }

function uploadFiles(files) {
  const picked = [...files].filter((f) => f.name.toLowerCase().endsWith(".eml"));
  const skipped = files.length - picked.length;
  if (skipped > 0) notify(`已跳过 ${skipped} 个非 .eml 文件`);
  if (!picked.length) return;
  QUEUE = picked; QINDEX = 0; CONFIRMED = 0; LAST_TASK = null;
  previewCurrent();
}

async function previewCurrent() {
  const file = QUEUE[QINDEX];
  if (!file) {
    closeVeil();
    await refresh();
    if (CONFIRMED) notify(`已导入 ${CONFIRMED} 封询价邮件，任务在收件箱中。`);
    if (LAST_TASK) openTask(LAST_TASK);
    return;
  }
  openVeil(`<div class="muted"><span class="spin"></span> 正在解析 ${esc(file.name)}…</div>`, "",
           "导入预览", `第 ${QINDEX + 1} / ${QUEUE.length} 个文件`);
  try {
    const res = await fetch("/api/preview?name=" + encodeURIComponent(file.name),
                            { method: "POST", body: file });
    const data = JSON.parse(await res.text());
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    showPreview(file, data);
  } catch (e) {
    showPreviewError(file, e.message);
  }
}

function advanceQueue() { QINDEX += 1; previewCurrent(); }

function previewBody(p) {
  const f = p.fields || {};
  const bar = (label, n) => {
    const pct = p.lines ? Math.round((n || 0) / p.lines * 100) : 0;
    return `<div class="bar"><div class="h"><span>${label}</span><span class="num">${n || 0}/${p.lines}</span></div>
      <div class="t"><div class="f ${n < p.lines ? "warn" : ""}" style="width:${pct}%"></div></div></div>`;
  };
  const findings = (p.quality || []).map((item) => `<div class="finding ${item.severity}">
      <span class="dot2"></span><span class="t">${esc(item.title)}</span>
      <span class="d">${esc(item.detail)}</span></div>`).join("");
  const reqs = (p.requirements || []).map((r) =>
    `<li>${esc(r.text)}<em>${esc(r.source)}</em></li>`).join("");
  const sample = (p.sample || []).map((r) => `<tr>
      <td class="r num">${esc(r.line_number)}</td><td><span class="pn">${esc(r.part_number)}</span></td>
      <td>${esc(r.description)}</td><td class="r num">${esc(r.quantity)}</td><td>${esc(r.unit)}</td></tr>`).join("");
  return `<div class="kv">
      <div><div class="k">客户</div><div class="v">${esc(p.customer || "未标注")}</div></div>
      <div><div class="k">询价号</div><div class="v mono">${esc(p.rfq_number || "—")}</div></div>
      <div><div class="k">评估日</div><div class="v">${esc(p.evaluation_date || "—")}</div></div>
      <div><div class="k">紧急度</div><div class="v">${p.urgency && p.urgency !== "NORMAL" ? "紧急" : "普通"}</div></div>
      <div><div class="k">载体</div><div class="v">${esc(CONTAINER[p.container] || p.container || "—")}</div></div>
      <div><div class="k">行数</div><div class="v">${p.lines}</div></div></div>
    <div class="bars" style="margin-top:11px">
      ${bar("料号", f.part_number)}${bar("数量", f.quantity)}${bar("单位", f.unit)}${bar("件状要求", f.condition)}
    </div>
    <div class="muted" style="margin-top:6px">${f.with_evidence ?? 0}/${p.lines} 行可回溯到原始单元格 ·
      来源 ${esc((p.source_files || []).join("、"))}</div>
    ${findings ? `<div class="findings">${findings}</div>` : ""}
    ${reqs ? `<div class="reqs"><div class="h">客户随附要求（${p.requirements.length} 条，原文照录）</div><ol>${reqs}</ol></div>` : ""}
    ${sample ? `<table class="sample"><thead><tr><th class="r">#</th><th>料号</th><th>描述</th>
      <th class="r">数量</th><th>单位</th></tr></thead><tbody>${sample}</tbody></table>
      <div class="muted" style="margin-top:4px">仅预览前 ${p.sample.length} 行，共 ${p.lines} 行；确认后完整处理。</div>` : ""}`;
}

function showPreview(file, p) {
  openVeil(previewBody(p),
    `<button class="btn l" id="pvCancelAll">全部取消</button>
     <button class="btn" id="pvSkip">不要这封</button>
     <button class="btn primary" id="pvOk">确认导入并处理</button>`,
    file.name, `第 ${QINDEX + 1} / ${QUEUE.length} 个文件`);
  $("pvCancelAll").onclick = () => { if (!PV_BUSY) { QUEUE = []; QINDEX = 0; previewCurrent(); } };
  $("pvSkip").onclick = () => { if (!PV_BUSY) advanceQueue(); };
  $("pvOk").onclick = () => confirmUpload(p.token);
}

function showPreviewError(file, message) {
  openVeil(`<div class="pverr">${esc(file.name)}：${esc(message)}</div>
      <div class="muted" style="margin-top:8px">这封邮件不会被导入；其余文件不受影响。</div>`,
    `<button class="btn l" id="pvCancelAll">全部取消</button>
     <button class="btn primary" id="pvSkip">跳过这封</button>`,
    file.name, `第 ${QINDEX + 1} / ${QUEUE.length} 个文件 · 解析失败`);
  $("pvCancelAll").onclick = () => { QUEUE = []; QINDEX = 0; previewCurrent(); };
  $("pvSkip").onclick = advanceQueue;
}

async function confirmUpload(token) {
  if (PV_BUSY) return;
  PV_BUSY = true;
  $("pvOk").disabled = true;
  try {
    const data = await api("/api/upload", { token });
    CONFIRMED += 1;
    if (data.task_id) LAST_TASK = data.task_id;
  } catch (e) {
    notify(`导入失败：${e.message}`, true);
  } finally {
    PV_BUSY = false;
    advanceQueue();
  }
}

/* ---------- entries: click, sidebar zone, full-page drag ---------- */
$("drop").onclick = () => $("file").click();
$("reset").onclick = resetDemo;
$("file").onchange = (e) => { if (e.target.files.length) uploadFiles(e.target.files); e.target.value = ""; };

let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files")) {
    dragDepth += 1; $("dragveil").hidden = false; e.preventDefault();
  }
});
window.addEventListener("dragover", (e) => {
  if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files")) e.preventDefault();
});
window.addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) $("dragveil").hidden = true;
});
window.addEventListener("drop", (e) => {
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    e.preventDefault();
    dragDepth = 0; $("dragveil").hidden = true;
    uploadFiles(e.dataTransfer.files);
  }
});

/* ---------- boot ---------- */
$("send").onclick = send;
$("askOpen").onclick = () => setAskOpen(true);
$("askClose").onclick = () => setAskOpen(false);
$("primary").onclick = start;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!$("askPanel").hidden) setAskOpen(false);
    else if (!$("choose").hidden) closeChoose();
    else if (!$("veil").hidden && !PV_BUSY) { QUEUE = []; QINDEX = 0; closeVeil(); refresh(); }
  }
});
$("chat").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

async function boot() {
  try { DATA = await api("/api/data"); } catch (e) { DATA = null; }
  try {
    const a = await api("/api/agent");
    $("modelname").textContent = a.enabled ? a.model : "模型未配置";
    $("chat").disabled = !a.enabled; $("send").disabled = !a.enabled;
    if (!a.enabled) $("chat").placeholder = `模型未配置（缺 ${a.missing.join("、")}）`;
  } catch (e) { /* deterministic flow stays usable */ }
  await refresh();
  const deepTask = new URLSearchParams(location.search).get("task");
  if (deepTask) openTask(deepTask);
}
boot();

</script>
