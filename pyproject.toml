[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixnext-rfq-agent"
version = "1.0.0"
description = "MatrixNEXT RFQ agent scaffold"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["deepagents>=0.5,<1", "langchain-openai>=1,<2"]
documents = ["openpyxl>=3.1,<4", "pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.scripts]
rfq-agent = "rfq_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rfq_agent*"]

[tool.setuptools.package-data]
rfq_agent = ["static/*.html"]
